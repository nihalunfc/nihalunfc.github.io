<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var KEY = 'nihal.review.pw';
  async function open(pw){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.it, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  function theme(){ return document.documentElement.getAttribute('data-theme') || 'light'; }
  function doc(inner){
    return '<!doctype html><html lang="en" data-theme="' + theme() + '"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<link rel="stylesheet" href="/assets/fonts/fonts.css"><base target="_blank"></head><body>' + inner + '</body></html>';
  }
  function fit(f){
    var d = f.contentDocument; if (!d || !d.documentElement) return;
    var h = d.documentElement.scrollHeight; if (Math.abs(f.offsetHeight - h) > 2) f.style.height = h + 'px';
  }
  function show(c){
    document.getElementById('lock').hidden = true;
    document.getElementById('content').hidden = false;
    [['f-cc', c.cc], ['f-review', c.review], ['f-guide', c.guide]].forEach(function(x){
      var f = document.getElementById(x[0]);
      f.addEventListener('load', function(){
        fit(f);
        try { new ResizeObserver(function(){ fit(f); }).observe(f.contentDocument.documentElement); } catch(e) { setInterval(function(){ fit(f); }, 1000); }
      });
      f.srcdoc = doc(x[1]);
    });
    window.addEventListener('themechange', function(){
      document.querySelectorAll('#content iframe').forEach(function(f){ try { f.contentDocument.documentElement.setAttribute('data-theme', theme()); } catch(e){} });
    });
  }
  var form = document.getElementById('form'), err = document.getElementById('err'), go = document.getElementById('go');
  form.addEventListener('submit', async function(e){
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Opening…';
    var pw = document.getElementById('pw').value;
    try { var c = await open(pw); try { sessionStorage.setItem(KEY, pw); } catch(x){} show(c); }
    catch(x){ err.textContent = 'That password did not work. Check it and try again.'; }
    go.disabled = false; go.textContent = 'Open';
  });
  try { var saved = sessionStorage.getItem(KEY); if (saved) open(saved).then(show).catch(function(){}); } catch(x){}
})();
</script>
